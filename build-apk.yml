              public static String buildHtml(List<CompanyNews> companies) {
                  DateTimeFormatter full = DateTimeFormatter.ofPattern("dd MMM yyyy, hh:mm a", Locale.ENGLISH);
                  DateTimeFormatter shortF = DateTimeFormatter.ofPattern("dd MMM, hh:mm a", Locale.ENGLISH);
                  String now = ZonedDateTime.now(IST).format(full) + " IST";
                  StringBuilder nav = new StringBuilder(), sections = new StringBuilder();
                  int total = 0;
                  for (int i = 0; i < companies.size(); i++) {
                      CompanyNews cn = companies.get(i);
                      Company c = cn.company;
                      total += cn.news.size();
                      nav.append("<a href=\"#c").append(i).append("\">").append(esc(c.name))
                              .append(" <span>").append(esc(c.code.toUpperCase())).append("</span></a>");
                      StringBuilder cards = new StringBuilder();
                      if (!cn.news.isEmpty()) {
                          for (Article n : cn.news) {
                              String when = Instant.ofEpochMilli(n.ts).atZone(IST).format(shortF);
                              cards.append("<a class=\"card\" href=\"").append(esc(n.link)).append("\">")
                                      .append("<div class=\"t\">").append(esc(n.title)).append("</div>")
                                      .append("<div class=\"m\"><b>").append(esc(n.source)).append("</b>")
                                      .append("<i>").append(when).append(" &middot; ").append(ago(n.ts)).append("</i></div></a>");
                          }
                      } else {
                          cards.append("<p class=\"none\">Pichhle ").append(MAX_DAYS)
                                  .append(" din me is company ki koi seedhi khabar nahi mili.</p>");
                      }
                      sections.append("<section id=\"c").append(i).append("\"><h2>").append(esc(c.name))
                              .append(" <span class=\"code\">").append(esc(c.code.toUpperCase())).append("</span>")
                              .append("<em>").append(cn.news.size()).append(" khabrein</em></h2><div class=\"grid\">")
                              .append(cards).append("</div></section>");
                  }
                  return "<!DOCTYPE html>\n<html lang=\"hi\"><head><meta charset=\"utf-8\">\n"
                          + "<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n"
                          + "<title>Latest Stock News</title>\n<style>\n" + CSS + "</style></head><body>\n"
                          + "<header><h1>&#128200; LATEST INDIAN STOCK NEWS</h1>\n"
                          + "<p>" + companies.size() + " companies &middot; " + total + " khabrein &middot; Updated: " + now + "</p></header>\n"
                          + "<nav>" + nav + "</nav>\n<main>" + sections + "</main>\n"
                          + "<footer>Source: Google News, Moneycontrol, Economic Times, Business Standard, Mint, Yahoo Finance etc. "
                          + "&middot; Sirf jaankari ke liye, investment salah nahi.</footer>\n</body></html>";
              }
          }
