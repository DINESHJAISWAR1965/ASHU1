              private void onAddClicked() {
                  final String name = etName.getText().toString().trim();
                  final String code = etCode.getText().toString().trim().toUpperCase();
                  final List<String> shorts = NewsEngine.splitNames(etShort.getText().toString());
                  final List<String> excl = NewsEngine.splitNames(etExcl.getText().toString());
                  if (name.isEmpty() || code.isEmpty()) {
                      toast("Company name aur NSE/BSE code dono zaroori hain.");
                      return;
                  }
                  if (!code.matches("[A-Z0-9&\\-]{1,20}")) {
                      toast("Code galat lag raha hai. Sirf letters/digits, jaise LT ya 500510.");
                      return;
                  }
                  showBusy("Yahoo Finance / Google se verify ho raha hai...");
                  bg.execute(() -> {
                      final NewsEngine.Match g = NewsEngine.lookupByCode(code);
                      runOnUiThread(() -> {
                          hideBusy();
                          if (isFinishing()) return;
                          if (g != null) {
                              confirmByCode(name, code, shorts, excl, g);
                          } else {
                              toast("Code '" + code + "' NSE/BSE par nahi mila.");
                              searchByName(name, code, shorts, excl);
                          }
                      });
                  });
              }

              private void confirmByCode(final String name, final String code, final List<String> shorts,
                                         final List<String> excl, final NewsEngine.Match g) {
                  new AlertDialog.Builder(this)
                          .setTitle("Kya ye sahi company hai?")
                          .setMessage("Aapne likha: " + name + " (" + code + ")\n\nOfficial: " + g.name
                                  + "\n[" + g.codes() + "]")
                          .setCancelable(false)
                          .setPositiveButton("Haan (Y)", (d, w) -> {
                              List<String> al = new ArrayList<>();
                              if (!g.shortName.isEmpty()) al.add(g.shortName);
                              al.addAll(shorts);
                              addCompany(g.name, code, String.join(",", al), excl);
                          })
                          .setNegativeButton("Nahi (N)", (d, w) -> searchByName(name, code, shorts, excl))
                          .show();
              }

              private void searchByName(final String name, final String code, final List<String> shorts,
                                        final List<String> excl) {
                  showBusy("Naam se company dhoondh raha hoon...");
                  bg.execute(() -> {
                      final List<NewsEngine.Match> found = new ArrayList<>();
                      final List<String> seen = new ArrayList<>();
                      List<String> queries = new ArrayList<>();
                      queries.add(name);
                      queries.addAll(shorts);
                      for (String q : queries) {
                          for (NewsEngine.Match m : NewsEngine.findCompanies(q)) {
                              String key = m.name.toLowerCase();
                              if (!seen.contains(key)) {
                                  seen.add(key);
                                  found.add(m);
                              }
                          }
                      }
                      // jis match me typed code ho use upar rakho
                      List<NewsEngine.Match> sorted = new ArrayList<>();
                      for (NewsEngine.Match m : found) {
                          if (code.equals(m.nse) || code.equals(m.bse)) sorted.add(m);
                      }
                      for (NewsEngine.Match m : found) if (!sorted.contains(m)) sorted.add(m);
                      runOnUiThread(() -> {
                          hideBusy();
                          if (isFinishing()) return;
                          showMatches(name, code, shorts, excl, sorted);
                      });
                  });
              }

              private void showMatches(final String name, final String code, final List<String> shorts,
                                       final List<String> excl, final List<NewsEngine.Match> found) {
                  if (found.isEmpty()) {
                      new AlertDialog.Builder(this)
                              .setTitle("Koi match nahi mila")
                              .setMessage("'" + name + "' ke liye koi company nahi mili.\n\n"
                                      + "Dobara likhna hai (Retype) ya jo likha hai wahi rakhna hai (Keep)?")
                              .setPositiveButton("Keep as typed",
                                      (d, w) -> addCompany(name, code, String.join(",", shorts), excl))
                              .setNegativeButton("Retype", null)
                              .show();
                      return;
                  }
                  final String[] items = new String[found.size()];
                  for (int i = 0; i < items.length; i++) {
                      items[i] = found.get(i).name + "\n[" + found.get(i).codes() + "]";
                  }
                  new AlertDialog.Builder(this)
                          .setTitle("Possible matches for '" + name + "'")
                          .setItems(items, (d, which) -> {
                              NewsEngine.Match f = found.get(which);
                              List<String> al = new ArrayList<>();
                              if (!f.shortName.isEmpty()) al.add(f.shortName);
                              al.addAll(shorts);
                              addCompany(f.name, f.bestCode(), String.join(",", al), excl);
                          })
                          .setPositiveButton("Keep as typed",
                                  (d, w) -> addCompany(name, code, String.join(",", shorts), excl))
                          .setNegativeButton("Retype", null)
                          .show();
              }

              private void addCompany(String name, String code, String alias, List<String> excl) {
                  NewsEngine.Company c = new NewsEngine.Company();
                  c.name = name;
                  c.code = code;
                  c.alias = alias;
                  c.excl = new ArrayList<>(excl);
                  companies.add(c);
                  etName.setText("");
                  etCode.setText("");
                  etShort.setText("");
                  etExcl.setText("");
                  refreshList();
                  toast("Saved: " + name + " (" + code.toUpperCase() + ")");
              }

              // ------------------------------------------------------------------ fetch news
              private void onGetNews() {
                  if (companies.isEmpty()) {
                      toast("Pehle kam se kam ek company jodo.");
                      return;
                  }
                  final List<NewsEngine.Company> snapshot = new ArrayList<>(companies);
                  showBusy("Khabar khoj raha hoon...");
                  bg.execute(() -> {
                      List<NewsEngine.CompanyNews> result = new ArrayList<>();
                      int n = snapshot.size();
                      for (int i = 0; i < n; i++) {
                          NewsEngine.Company c = snapshot.get(i);
                          setBusyText("(" + (i + 1) + "/" + n + ") Khabar khoj raha hoon:\n" + c.name
                                  + " (" + c.code.toUpperCase() + ")");
                          NewsEngine.CompanyNews cn = new NewsEngine.CompanyNews();
                          cn.company = c;
                          try {
                              cn.news = NewsEngine.getCompanyNews(c, this::setBusyText);
                          } catch (Exception e) {
                              cn.news = new ArrayList<>();
                          }
                          result.add(cn);
                      }
                      final String html = NewsEngine.buildHtml(result);
                      runOnUiThread(() -> {
                          hideBusy();
                          if (isFinishing()) return;
                          lastHtml = html;
                          web.loadDataWithBaseURL(FAKE_BASE, html, "text/html", "utf-8", null);
                          formView.setVisibility(View.GONE);
                          web.setVisibility(View.VISIBLE);
                          saveBtn.setVisibility(View.VISIBLE);
                      });
                  });
              }

              // ------------------------------------------------------------------ save HTML to Downloads
              private void onSaveClicked() {
                  if (lastHtml == null) {
                      toast("Save karne ke liye abhi koi news nahi hai.");
                      return;
                  }
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q
                          && checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.WRITE_EXTERNAL_STORAGE}, REQ_STORAGE);
                      return;
                  }
                  saveHtmlToDownloads();
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == REQ_STORAGE) {
                      if (grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                          saveHtmlToDownloads();
                      } else {
                          toast("Storage permission nahi mili, isliye save nahi ho paya.");
                      }
                  }
              }

              private void saveHtmlToDownloads() {
                  final String fileName = "LATEST_NEWS_"
                          + new SimpleDateFormat("yyyyMMdd_HHmm", Locale.ENGLISH).format(new Date()) + ".html";
                  final byte[] data = lastHtml.getBytes(StandardCharsets.UTF_8);
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          ContentValues cv = new ContentValues();
                          cv.put(MediaStore.Downloads.DISPLAY_NAME, fileName);
                          cv.put(MediaStore.Downloads.MIME_TYPE, "text/html");
                          cv.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                          Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv);
                          if (uri == null) throw new Exception("file nahi ban payi");
                          try (OutputStream os = getContentResolver().openOutputStream(uri)) {
                              os.write(data);
                          }
                      } else {
                          File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                          if (!dir.exists()) dir.mkdirs();
                          try (FileOutputStream os = new FileOutputStream(new File(dir, fileName))) {
                              os.write(data);
                          }
                      }
                      toast("Save ho gaya: Download/" + fileName);
                  } catch (Exception e) {
                      toast("Save nahi ho paya: " + e.getMessage());
                  }
              }

              // ------------------------------------------------------------------ misc
              private void toast(String s) {
                  Toast.makeText(this, s, Toast.LENGTH_LONG).show();
              }

              @Override
              public void onBackPressed() {
                  if (web.getVisibility() == View.VISIBLE) {          // news page se wapas form par
                      web.setVisibility(View.GONE);
                      saveBtn.setVisibility(View.GONE);
                      formView.setVisibility(View.VISIBLE);
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  hideBusy();
                  bg.shutdownNow();
                  super.onDestroy();
              }
          }
