name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Java 17 setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK licence accept
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Gradle 8.7 setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Project files banao
        run: |
          set -e
          mkdir -p proj && cd proj
          cat > settings.gradle <<'LNEOF0'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LatestNewsIndStock"
          include ':app'
          LNEOF0
          cat > build.gradle <<'LNEOF1'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          LNEOF1
          cat > gradle.properties <<'LNEOF2'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          LNEOF2
          mkdir -p app
          cat > app/build.gradle <<'LNEOF3'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.dkj.latestnews'
              compileSdk 34

              defaultConfig {
                  applicationId "com.dkj.latestnews"
                  minSdk 26
                  targetSdk 34
                  versionCode 2
                  versionName "1.1"
              }

              signingConfigs {
                  release {
                      storeFile file('release.jks')
                      storePassword 'latestnews123'
                      keyAlias 'latestnews'
                      keyPassword 'latestnews123'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          LNEOF3
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'LNEOF4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="Latest Stock News"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          LNEOF4
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/colors.xml <<'LNEOF5'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_background">#0F172A</color>
          </resources>
          LNEOF5
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_foreground.xml <<'LNEOF6'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#1E3A8A" android:pathData="M30,60h9v18h-9z" />
              <path android:fillColor="#0EA5E9" android:pathData="M45,52h9v26h-9z" />
              <path android:fillColor="#38BDF8" android:pathData="M60,44h9v34h-9z" />
              <path
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="3"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round"
                  android:pathData="M28,52L45,40L55,46L78,28" />
              <path
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="3"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round"
                  android:pathData="M69,28L78,28L78,37" />
          </vector>
          LNEOF6
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'LNEOF7'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_background" />
              <foreground android:drawable="@drawable/ic_foreground" />
          </adaptive-icon>
          LNEOF7
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'LNEOF8'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_background" />
              <foreground android:drawable="@drawable/ic_foreground" />
          </adaptive-icon>
          LNEOF8
          mkdir -p app/src/main/java/com/dkj/latestnews
          cat > app/src/main/java/com/dkj/latestnews/NewsEngine.java <<'LNEOF9'
          package com.dkj.latestnews;

          import org.json.JSONArray;
          import org.json.JSONObject;
          import org.w3c.dom.Document;
          import org.w3c.dom.Element;
          import org.w3c.dom.NodeList;

          import java.io.ByteArrayInputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.nio.charset.StandardCharsets;
          import java.time.Instant;
          import java.time.LocalDate;
          import java.time.LocalDateTime;
          import java.time.OffsetDateTime;
          import java.time.ZoneId;
          import java.time.ZoneOffset;
          import java.time.ZonedDateTime;
          import java.time.format.DateTimeFormatter;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Base64;
          import java.util.Collections;
          import java.util.HashSet;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.Set;
          import java.util.concurrent.Callable;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.Future;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          import javax.xml.parsers.DocumentBuilderFactory;

          /**
           * LATEST NEWS - INDIAN STOCKS (Android/Java version)
           * Python program ka pura logic yahan Java me hai.
           * Is file me Android ki koi class nahi hai (sirf org.json jo Android me pehle se hota hai).
           */
          public class NewsEngine {

              // ------------------------- SETTINGS -------------------------
              public static final int MAX_DAYS = 3;          // isse purani khabar nahi dikhegi (din)
              static final int MAX_PER_COMPANY = 40;         // ek company ki max khabrein
              static final int TIMEOUT_MS = 15000;

              static final String[] JUNK_PHRASES = {
                      "share price", "stock price", "nse/bse live", "live bse/nse",
                      "profit and loss", "index composition", "stocks to watch", "stocks in focus",
                      "stocks to buy", "top gainers", "top losers", "buy, sell or hold",
                      "stock picks", "stocks today", "sector stocks", "bank holiday",
                      "market live", "sensex today", "nifty today", "weekly recap",
                      "seasonal returns", "returns chart", "historical data", "annual report", "mtf research"
              };
              static final Set<String> CORP_WORDS = new HashSet<>(Arrays.asList(
                      "ltd", "limited", "pvt", "private", "inc", "corp", "corporation", "co", "the"));

              static final String[][] SITES = {
                      {"Moneycontrol", "moneycontrol.com"},
                      {"Economic Times", "economictimes.indiatimes.com"},
                      {"Business Standard", "business-standard.com"},
                      {"Mint", "livemint.com"},
                      {"Hindu BusinessLine", "thehindubusinessline.com"},
                      {"NDTV Profit", "ndtvprofit.com"},
                      {"Financial Express", "financialexpress.com"},
                      {"Business Today", "businesstoday.in"}
              };

              static final String UA = "Mozilla/5.0 (Linux; Android 13; Mobile) LatestStockNews/1.1";
              static final ZoneId IST = ZoneId.of("Asia/Kolkata");
              // ------------------------------------------------------------

              // ---------------------------- MODELS ----------------------------
              public static class Company {
                  public String name = "";
                  public String code = "";
                  public String alias = "";                       // comma separated short names
                  public List<String> excl = new ArrayList<>();   // words to exclude
              }

              public static class Article {
                  public String title, link, source;
                  public long ts;                                 // epoch millis
              }

              public static class Match {
                  public String name = "", shortName = "", nse = null, bse = null;

                  public String codes() {
                      StringBuilder sb = new StringBuilder();
                      if (nse != null) sb.append("NSE: ").append(nse);
                      if (bse != null) {
                          if (sb.length() > 0) sb.append("  |  ");
                          sb.append("BSE: ").append(bse);
                      }
                      return sb.toString();
                  }

                  public String bestCode() {
                      return nse != null ? nse : bse;
                  }
              }

              public static class CompanyNews {
                  public Company company;
                  public List<Article> news = new ArrayList<>();
              }

              interface Progress {
                  void say(String msg);
              }

              // ---------------------------- HTTP ----------------------------
              static byte[] httpBytes(String url, byte[] post, String contentType, int timeoutMs, int limit)
                      throws Exception {
                  HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                  c.setConnectTimeout(timeoutMs);
                  c.setReadTimeout(timeoutMs);
                  c.setInstanceFollowRedirects(true);
                  c.setRequestProperty("User-Agent", UA);
                  if (post != null) {
                      c.setRequestMethod("POST");
                      c.setDoOutput(true);
                      if (contentType != null) c.setRequestProperty("Content-Type", contentType);
                      try (OutputStream os = c.getOutputStream()) {
                          os.write(post);
                      }
                  }
                  try (InputStream in = c.getInputStream()) {
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = in.read(buf)) > 0) {
                          bo.write(buf, 0, n);
                          if (bo.size() >= limit) break;
                      }
                      return bo.toByteArray();
                  } finally {
                      c.disconnect();
                  }
              }

              static byte[] fetch(String url) throws Exception {
                  return httpBytes(url, null, null, TIMEOUT_MS, 5_000_000);
              }

              static String httpText(String url) throws Exception {
                  return new String(httpBytes(url, null, null, 10000, 400000), StandardCharsets.UTF_8);
              }

              static String enc(String s) {
                  try {
                      return URLEncoder.encode(s, "UTF-8");
                  } catch (Exception e) {
                      return s;
                  }
              }

              // ---------------------------- RSS ----------------------------
              static String childText(Element parent, String tag) {
                  NodeList nl = parent.getElementsByTagName(tag);
                  if (nl.getLength() == 0) return null;
                  String t = nl.item(0).getTextContent();
                  return t == null ? null : t.trim();
              }

              static List<Article> parseRss(byte[] data, String defaultSource) {
                  List<Article> items = new ArrayList<>();
                  try {
                      DocumentBuilderFactory f = DocumentBuilderFactory.newInstance();
                      Document doc = f.newDocumentBuilder().parse(new ByteArrayInputStream(data));
                      NodeList nl = doc.getElementsByTagName("item");
                      for (int i = 0; i < nl.getLength(); i++) {
                          Element it = (Element) nl.item(i);
                          String title = childText(it, "title");
                          String link = childText(it, "link");
                          String pub = childText(it, "pubDate");
                          String src = childText(it, "source");
                          if (src == null || src.isEmpty()) src = defaultSource;
                          long ts;
                          try {
                              ts = ZonedDateTime.parse(pub, DateTimeFormatter.RFC_1123_DATE_TIME)
                                      .toInstant().toEpochMilli();
                          } catch (Exception e) {
                              continue;
                          }
                          if (title != null && !title.isEmpty() && link != null && !link.isEmpty()) {
                              Article a = new Article();
                              a.title = title;
                              a.link = link;
                              a.source = src;
                              a.ts = ts;
                              items.add(a);
                          }
                      }
                  } catch (Exception e) {
                      // XML kharab hai to khali list
                  }
                  return items;
              }

              static String googleNewsUrl(String query, List<String> excl) {
                  StringBuilder minus = new StringBuilder();
                  if (excl != null) for (String x : excl) minus.append(" -\"").append(x).append("\"");
                  String q = enc(query + minus + " when:" + MAX_DAYS + "d");
                  return "https://news.google.com/rss/search?q=" + q + "&hl=en-IN&gl=IN&ceid=IN:en";
              }

              static class Job {
                  final String label, url;

                  Job(String l, String u) {
                      label = l;
                      url = u;
                  }
              }

              static List<Job> buildJobs(String name, String code, String alias, List<String> excl) {
                  List<Job> jobs = new ArrayList<>();
                  jobs.add(new Job("Google News", googleNewsUrl("\"" + name + "\" (" + code + ") share OR stock", excl)));
                  jobs.add(new Job("Google News", googleNewsUrl("\"" + name + "\"", excl)));
                  Set<String> seen = new HashSet<>();
                  seen.add(name.toLowerCase());
                  for (String a : alias.split(",")) {
                      a = a.trim();
                      if (!a.isEmpty() && seen.add(a.toLowerCase())) {
                          jobs.add(new Job("Google News", googleNewsUrl("\"" + a + "\" share OR stock OR company", excl)));
                      }
                  }
                  for (String[] s : SITES) {
                      jobs.add(new Job(s[0], googleNewsUrl("\"" + name + "\" site:" + s[1], excl)));
                  }
                  String suffix = isDigits(code) ? ".BO" : ".NS";
                  jobs.add(new Job("Yahoo Finance",
                          "https://feeds.finance.yahoo.com/rss/2.0/headline?s=" + enc(code.toUpperCase() + suffix)
                                  + "&region=IN&lang=en-IN"));
                  return jobs;
              }

              // ---------------------------- RELEVANCE ----------------------------
              static boolean isDigits(String s) {
                  if (s == null || s.isEmpty()) return false;
                  for (int i = 0; i < s.length(); i++) if (!Character.isDigit(s.charAt(i))) return false;
                  return true;
              }

              static String norm(String s) {
                  String x = s.toLowerCase().replaceAll("[^a-z0-9]+", " ").trim();
                  return x.replaceAll("\\s+", " ");
              }

              static Set<String> buildTerms(String name, String code, String alias) {
                  Set<String> terms = new HashSet<>();
                  String[] words = norm(name).isEmpty() ? new String[0] : norm(name).split(" ");
                  terms.add(String.join(" ", words));
                  List<String> core = new ArrayList<>();
                  for (String w : words) if (!CORP_WORDS.contains(w)) core.add(w);
                  if (!core.isEmpty()) terms.add(String.join(" ", core));
                  for (String a : alias.split(",")) {
                      String n = norm(a);
                      if (!n.isEmpty()) terms.add(n);
                  }
                  if (!isDigits(code) && code.length() >= 3) terms.add(norm(code));
                  terms.remove("");
                  return terms;
              }

              static boolean isRelevant(String title, Set<String> terms, String name, List<String> excl) {
                  String t = title;
                  int p = t.lastIndexOf(" - ");
                  if (p >= 0) t = t.substring(0, p);              // " - Source" hata do
                  String low = t.toLowerCase();
                  for (String j : JUNK_PHRASES) if (low.contains(j)) return false;
                  String nt = norm(t);
                  String full = " " + norm(title) + " ";
                  if (excl != null) {
                      for (String x : excl) {
                          String nx = norm(x);
                          if (!nx.isEmpty() && full.contains(" " + nx + " ")) return false;
                      }
                  }
                  if (nt.length() <= norm(name).length() + 4) return false;
                  String padded = " " + nt + " ";
                  for (String term : terms) if (padded.contains(" " + term + " ")) return true;
                  return false;
              }

              // ---------------------------- REAL DATE ----------------------------
              static final Map<String, Integer> MONTHS = new LinkedHashMap<>();

              static {
                  String[] m = {"jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"};
                  for (int i = 0; i < m.length; i++) MONTHS.put(m[i], i + 1);
              }

              /** Google News ke redirect link se asli article ka link nikalta hai (best effort). */
              static String resolveGoogleUrl(String link) {
                  Matcher m = Pattern.compile("/articles/([^?/]+)").matcher(link);
                  if (!m.find()) return null;
                  String gid = m.group(1);
                  // purana tarika: link base64 ke andar chhupa hota hai
                  try {
                      byte[] raw = Base64.getUrlDecoder().decode(gid);
                      if (raw.length > 4 && (raw[0] & 0xff) == 0x08 && (raw[1] & 0xff) == 0x13 && (raw[2] & 0xff) == 0x22) {
                          int ln = raw[3] & 0xff;
                          int off = 4;
                          if (ln >= 0x80) {
                              ln = (ln & 0x7F) | ((raw[4] & 0xff) << 7);
                              off = 5;
                          }
                          if (off + ln <= raw.length) {
                              String url = new String(raw, off, ln, StandardCharsets.UTF_8);
                              if (url.startsWith("http")) return url;
                          }
                      }
                  } catch (Exception ignored) {
                  }
                  // naya tarika: Google ke batchexecute se
                  try {
                      String page = httpText("https://news.google.com/rss/articles/" + gid);
                      Matcher sg = Pattern.compile("data-n-a-sg=\"([^\"]+)\"").matcher(page);
                      Matcher ts = Pattern.compile("data-n-a-ts=\"([^\"]+)\"").matcher(page);
                      if (!(sg.find() && ts.find())) return null;
                      String inner = "[\"garturlreq\",[[\"X\",\"X\",[\"X\",\"X\"],null,null,1,1,\"US:en\",null,1,null,null,"
                              + "null,null,null,0,1],\"X\",\"X\",1,[1,1,1],1,1,null,0,0,null,0],\""
                              + gid + "\"," + ts.group(1) + ",\"" + sg.group(1) + "\"]";
                      JSONArray req = new JSONArray().put(new JSONArray().put(new JSONArray()
                              .put("Fbv4je").put(inner).put(JSONObject.NULL).put("generic")));
                      String body = "f.req=" + enc(req.toString());
                      String resp = new String(httpBytes("https://news.google.com/_/DotsSplashUi/data/batchexecute",
                              body.getBytes(StandardCharsets.UTF_8),
                              "application/x-www-form-urlencoded;charset=UTF-8", 10000, 400000), StandardCharsets.UTF_8);
                      int cut = resp.indexOf("\n\n");
                      if (cut < 0) return null;
                      JSONArray parsed = new JSONArray(resp.substring(cut + 2).trim());
                      String third = parsed.getJSONArray(0).getString(2);
                      return new JSONArray(third).getString(1);
                  } catch (Exception e) {
                      return null;
                  }
              }

              /** Text se date nikalta hai (ISO ya "12 Nov 2026"). Na mile to null. Return: epoch millis. */
              static Long parseAnyDate(String txt) {
                  txt = txt.trim();
                  try {
                      return OffsetDateTime.parse(txt).toInstant().toEpochMilli();
                  } catch (Exception ignored) {
                  }
                  try {
                      return OffsetDateTime.parse(txt, DateTimeFormatter.ofPattern("yyyy-MM-dd'T'HH:mm:ssZ"))
                              .toInstant().toEpochMilli();
                  } catch (Exception ignored) {
                  }
                  try {
                      return OffsetDateTime.parse(txt, DateTimeFormatter.ofPattern("yyyy-MM-dd'T'HH:mm:ss.SSSZ"))
                              .toInstant().toEpochMilli();
                  } catch (Exception ignored) {
                  }
                  try {
                      return LocalDateTime.parse(txt.replace(' ', 'T')).atZone(IST).toInstant().toEpochMilli();
                  } catch (Exception ignored) {
                  }
                  try {
                      return LocalDate.parse(txt).atStartOfDay(IST).toInstant().toEpochMilli();
                  } catch (Exception ignored) {
                  }
                  Matcher m = Pattern.compile("(\\d{1,2})\\s+([A-Za-z]{3})[a-z]*,?\\s+(20\\d\\d)").matcher(txt);
                  if (m.find()) {
                      Integer mon = MONTHS.get(m.group(2).toLowerCase());
                      if (mon != null) {
                          try {
                              return LocalDate.of(Integer.parseInt(m.group(3)), mon, Integer.parseInt(m.group(1)))
                                      .atStartOfDay(IST).toInstant().toEpochMilli();
                          } catch (Exception ignored) {
                          }
                      }
                  }
                  return null;
              }

              static final Pattern[] DATE_PATS = {
                      Pattern.compile("property=[\"']article:published_time[\"'][^>]*content=[\"']([^\"']+)", Pattern.CASE_INSENSITIVE),
                      Pattern.compile("content=[\"']([^\"']+)[\"'][^>]*property=[\"']article:published_time", Pattern.CASE_INSENSITIVE),
                      Pattern.compile("\"datePublished\"\\s*:\\s*\"([^\"]+)", Pattern.CASE_INSENSITIVE),
                      Pattern.compile("itemprop=[\"']datePublished[\"'][^>]*content=[\"']([^\"']+)", Pattern.CASE_INSENSITIVE),
                      Pattern.compile("name=[\"'](?:date|publish[-_]?date|pubdate)[\"'][^>]*content=[\"']([^\"']+)", Pattern.CASE_INSENSITIVE),
                      Pattern.compile("Published on\\s+([0-9]{1,2}\\s+[A-Za-z]{3,9}\\s+20\\d\\d)", Pattern.CASE_INSENSITIVE)
              };

              /** Article page khol kar asli chhapne ki tareekh nikalta hai. Na mile to null. */
              static Long realPublishDate(String link) {
                  try {
                      String url = link.contains("news.google.com") ? resolveGoogleUrl(link) : link;
                      if (url == null) return null;
                      String page = httpText(url);
                      for (Pattern p : DATE_PATS) {
                          Matcher m = p.matcher(page);
                          if (m.find()) {
                              Long d = parseAnyDate(m.group(1));
                              if (d != null) return d;
                          }
                      }
                  } catch (Exception ignored) {
                  }
                  return null;
              }

              static List<Article> dropStale(List<Article> news, Progress pg) {
                  long cutoff = System.currentTimeMillis() - MAX_DAYS * 86400000L;
                  List<Long> dates = parallel(news, 10, a -> realPublishDate(a.link));
                  List<Article> kept = new ArrayList<>();
                  for (int i = 0; i < news.size(); i++) {
                      Article n = news.get(i);
                      Long d = dates.get(i);
                      if (d != null) {
                          if (d < cutoff) continue;       // purani khabar hata di
                          n.ts = Math.min(n.ts, d);
                      }
                      kept.add(n);
                  }
                  return kept;
              }

              // ---------------------------- PARALLEL HELPER ----------------------------
              interface Fn<A, B> {
                  B apply(A a) throws Exception;
              }

              static <A, B> List<B> parallel(List<A> in, int threads, final Fn<A, B> fn) {
                  ExecutorService ex = Executors.newFixedThreadPool(Math.max(1, threads));
                  List<Future<B>> fs = new ArrayList<>();
                  try {
                      for (final A a : in) {
                          fs.add(ex.submit(new Callable<B>() {
                              @Override
                              public B call() {
                                  try {
                                      return fn.apply(a);
                                  } catch (Exception e) {
                                      return null;
                                  }
                              }
                          }));
                      }
                      List<B> out = new ArrayList<>();
                      for (Future<B> f : fs) {
                          try {
                              out.add(f.get());
                          } catch (Exception e) {
                              out.add(null);
                          }
                      }
                      return out;
                  } finally {
                      ex.shutdown();
                  }
              }

              // ---------------------------- MAIN NEWS FETCH ----------------------------
              public static List<Article> getCompanyNews(Company c, Progress pg) {
                  Set<String> terms = buildTerms(c.name, c.code, c.alias);
                  List<List<Article>> results = parallel(buildJobs(c.name, c.code, c.alias, c.excl), 8, job -> {
                      try {
                          return parseRss(fetch(job.url), job.label);
                      } catch (Exception e) {
                          return new ArrayList<Article>();
                      }
                  });
                  long cutoff = System.currentTimeMillis() - MAX_DAYS * 86400000L;
                  Set<String> seen = new HashSet<>();
                  List<Article> news = new ArrayList<>();
                  for (List<Article> lst : results) {
                      if (lst == null) continue;
                      for (Article n : lst) {
                          if (n.ts < cutoff) continue;
                          if (!isRelevant(n.title, terms, c.name, c.excl)) continue;
                          String key = n.title.toLowerCase();
                          if (key.length() > 80) key = key.substring(0, 80);
                          if (!seen.add(key)) continue;
                          news.add(n);
                      }
                  }
                  Collections.sort(news, (a, b) -> Long.compare(b.ts, a.ts));
                  if (news.size() > MAX_PER_COMPANY) news = new ArrayList<>(news.subList(0, MAX_PER_COMPANY));
                  if (pg != null) pg.say(c.name + ": " + news.size() + " khabrein mili, date check ho rahi hai...");
                  news = dropStale(news, pg);
                  Collections.sort(news, (a, b) -> Long.compare(b.ts, a.ts));
                  return news;
              }

              // ---------------------------- COMPANY VERIFY ----------------------------
              static List<Match> yahooSearch(String q) {
                  List<Match> out = new ArrayList<>();
                  try {
                      String url = "https://query2.finance.yahoo.com/v1/finance/search?q=" + enc(q)
                              + "&quotesCount=10&newsCount=0&region=IN&lang=en-IN";
                      JSONObject data = new JSONObject(new String(fetch(url), StandardCharsets.UTF_8));
                      JSONArray quotes = data.optJSONArray("quotes");
                      if (quotes == null) return out;
                      for (int i = 0; i < quotes.length(); i++) {
                          JSONObject it = quotes.getJSONObject(i);
                          String sym = it.optString("symbol", "");
                          if (!"EQUITY".equals(it.optString("quoteType")) || !(sym.endsWith(".NS") || sym.endsWith(".BO")))
                              continue;
                          String longName = it.optString("longname", "").trim();
                          String shortName = it.optString("shortname", "").trim();
                          Match m = new Match();
                          m.name = !longName.isEmpty() ? longName : (!shortName.isEmpty() ? shortName : sym);
                          m.shortName = shortName;
                          String s = sym.substring(0, sym.length() - 3);
                          if (sym.endsWith(".NS")) m.nse = s;
                          else m.bse = s;
                          out.add(m);
                      }
                  } catch (Exception ignored) {
                  }
                  return out;
              }

              static List<String> googleSuggest(String q) {
                  List<String> cleaned = new ArrayList<>();
                  try {
                      String url = "https://suggestqueries.google.com/complete/search?client=firefox&q="
                              + enc(q + " share price");
                      JSONArray data = new JSONArray(new String(fetch(url), StandardCharsets.UTF_8));
                      JSONArray sugg = data.getJSONArray(1);
                      for (int i = 0; i < sugg.length(); i++) {
                          String x = sugg.getString(i).replaceAll(
                                  "(?i)\\b(share price|stock price|share|stock|price|news|target|nse|bse)\\b", "");
                          x = x.trim().replaceAll("\\s+", " ");
                          boolean dup = false;
                          for (String c : cleaned) if (c.equalsIgnoreCase(x)) dup = true;
                          if (!x.isEmpty() && !dup) cleaned.add(x);
                      }
                  } catch (Exception ignored) {
                  }
                  return cleaned.size() > 3 ? cleaned.subList(0, 3) : cleaned;
              }

              /** Naam se NSE+BSE companies dhoondta hai (galat spelling par suggestion bhi try karta hai). */
              public static List<Match> findCompanies(String query) {
                  List<Match> results = yahooSearch(query);
                  if (results.isEmpty()) {
                      for (String s : googleSuggest(query)) results.addAll(yahooSearch(s));
                  }
                  if (results.isEmpty()) {
                      String[] parts = query.trim().split("\\s+");
                      String first = parts.length > 0 ? parts[0] : "";
                      if (first.length() >= 3 && !first.equals(query)) results = yahooSearch(first);
                  }
                  Map<String, Match> grouped = new LinkedHashMap<>();   // ek company = NSE + BSE ek saath
                  for (Match r : results) {
                      Match g = grouped.get(norm(r.name));
                      if (g == null) {
                          g = new Match();
                          g.name = r.name;
                          g.shortName = r.shortName;
                          grouped.put(norm(r.name), g);
                      }
                      if (g.nse == null && r.nse != null) g.nse = r.nse;
                      if (g.bse == null && r.bse != null) g.bse = r.bse;
                  }
                  return new ArrayList<>(grouped.values());
              }

              static JSONObject yahooChartMeta(String sym) {
                  try {
                      String url = "https://query1.finance.yahoo.com/v8/finance/chart/" + enc(sym)
                              + "?range=1d&interval=1d";
                      JSONObject data = new JSONObject(new String(fetch(url), StandardCharsets.UTF_8));
                      JSONObject meta = data.getJSONObject("chart").getJSONArray("result").getJSONObject(0)
                              .getJSONObject("meta");
                      if (!"EQUITY".equals(meta.optString("instrumentType", "EQUITY"))) return null;
                      return meta;
                  } catch (Exception e) {
                      return null;
                  }
              }

              /** NSE code ya BSE code (6 ank) se asli (official) company pata karta hai. */
              public static Match lookupByCode(String code) {
                  String c = code.trim().toUpperCase();
                  String[] syms = isDigits(c) ? new String[]{c + ".BO"} : new String[]{c + ".NS", c + ".BO"};
                  Match g = null;
                  for (String sym : syms) {
                      JSONObject meta = yahooChartMeta(sym);
                      if (meta == null) continue;
                      String name = meta.optString("longName", "").trim();
                      if (name.isEmpty()) name = meta.optString("shortName", "").trim();
                      if (name.isEmpty()) continue;
                      boolean nse = sym.endsWith(".NS");
                      if (g == null) {
                          g = new Match();
                          g.name = name;
                          g.shortName = meta.optString("shortName", "").trim();
                      }
                      if (norm(name).equals(norm(g.name))) {
                          if (nse) g.nse = c;
                          else g.bse = c;
                      }
                  }
                  if (g == null) {                                   // chart na chale to search se try
                      Match first = null;
                      for (Match r : yahooSearch(c)) {
                          String s = r.bestCode();
                          if (s != null && s.equalsIgnoreCase(c)) {
                              if (first == null) {
                                  first = r;
                                  g = new Match();
                                  g.name = r.name;
                                  g.shortName = r.shortName;
                              }
                              if (norm(r.name).equals(norm(first.name))) {
                                  if (r.nse != null && g.nse == null) g.nse = r.nse;
                                  if (r.bse != null && g.bse == null) g.bse = r.bse;
                              }
                          }
                      }
                  }
                  return g;
              }

              public static List<String> splitNames(String text) {
                  List<String> out = new ArrayList<>();
                  for (String x : text.split("[;,]")) {
                      x = x.trim();
                      if (!x.isEmpty()) out.add(x);
                  }
                  return out;
              }

              // ---------------------------- HTML ----------------------------
              static String esc(String s) {
                  return s.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")
                          .replace("\"", "&quot;").replace("'", "&#39;");
              }

              static String ago(long ts) {
                  long s = (System.currentTimeMillis() - ts) / 1000;
                  if (s < 3600) return Math.max(1, s / 60) + " min pehle";
                  if (s < 86400) return (s / 3600) + " ghante pehle";
                  return (s / 86400) + " din pehle";
              }

